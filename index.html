<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventario Industrial</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; text-align:center; }
        #video { width:100%; max-height:40vh; background:#000; }
        #status { font-size:1.1rem; padding:10px; background:#222; margin-bottom:10px; }
        button { width:90%; padding:12px; margin:8px 0; font-size:1.05rem; border:none; border-radius:8px; background:#007bff; color:#fff; }
        #fileInput { margin:15px 0; }
        #tabla { width:100%; margin-top:18px; font-size:1.02rem; }
        table { width:100%; border-collapse:collapse; margin-top:10px; }
        th, td { border:1px solid #444; padding:8px; }
        th { background:#333; }
        #cantidadInput { width:80px; font-size:1.05rem; padding:5px; }
        #pantallaSesion { padding:18px; background:#222; }
        #ubicacionInput { width:90%; padding:10px; font-size:1.05rem; margin-top:10px; border-radius:6px; border:none; }
        #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:8px 14px; border-radius:8px; border:1px solid #444; display:none; font-size:0.95rem; }
    </style>
</head>
<body>

<div id="toast" aria-hidden="true">Sonido activado</div>

<div id="pantallaSesion">
    <h2>📍 Configurar sesión</h2>
    <button id="btnSiUbic" onclick="iniciarSesion(true)">Sí, usar ubicación</button>
    <button id="btnNoUbic" onclick="iniciarSesion(false)" style="background:#555;">No usar ubicación</button>
    <div id="campoUbicacion" style="display:none;">
        <h3>Introduce ubicación:</h3>
        <input type="text" id="ubicacionInput" placeholder="Ej: Pasillo 3B" />
        <button onclick="confirmarUbicacion()">Confirmar ubicación</button>
    </div>
</div>

<div id="app" style="display:none;">
    <h2>📦 Inventario Industrial</h2>
    <div id="status">Esperando configuración de sesión…</div>
    <video id="video" autoplay playsinline></video>
    <hr>
    <h3>📁 Cargar maestro CSV</h3>
    <input type="file" id="fileInput" accept=".csv" />
    <h3>📥 Registro</h3>
    Cantidad: <input type="number" id="cantidadInput" value="1" min="1" />
    <div id="descripcionProducto" style="margin-top:10px; font-size:1.05rem; color:#0f0;"></div>
    <button id="btnRegistrar">Registrar</button>
    <hr>
    <h3>📄 Inventario actual</h3>
    <div id="tabla"></div>
    <button id="btnExportar">Exportar CSV</button>
    <button id="btnLimpiar" style="background:#b30000;">Limpiar inventario</button>
</div>

<script>
    // Registro del Service Worker corregido
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/pwabuilder-sw.js')
                .then(reg => console.log('SW registrado', reg))
                .catch(err => console.log('SW fallo', err));
        });
    }

    /* --- LÓGICA DE LA APP --- */
    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const descripcionDiv = document.getElementById('descripcionProducto');
    const toast = document.getElementById('toast');
    let maestro = {}, inventario = [], ultimoCodigo = '', detector = null, puedeEscanear = true;
    let sesionConUbicacion = false, ubicacionActual = '', audioCtx = null, audioUnlocked = false;

    function crearAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    async function unlockAudioIfNeeded() { if (audioUnlocked) return; crearAudioContext(); await audioCtx.resume(); audioUnlocked = true; }
    function iniciarSesion(conUbicacion) { unlockAudioIfNeeded(); sesionConUbicacion = conUbicacion; document.getElementById('campoUbicacion').style.display = conUbicacion ? 'block' : 'none'; if (!conUbicacion) iniciarCamara(); }
    function confirmarUbicacion() { unlockAudioIfNeeded(); ubicacionActual = document.getElementById('ubicacionInput').value; document.getElementById('pantallaSesion').style.display = 'none'; document.getElementById('app').style.display = 'block'; iniciarCamara(); }
    async function iniciarCamara() { try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); video.srcObject = stream; document.getElementById('pantallaSesion').style.display = 'none'; document.getElementById('app').style.display = 'block'; } catch(e) { alert('Error cámara'); } }
    
    // (Asegúrate de mantener el resto de tus funciones aquí abajo, hasta el final de tu script original)
</script>
</body>
</html>
