<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Cámara</title></head>
<body>
  <h2>Diagnóstico Cámara Android</h2>
  <div id="reader" style="width:100%;height:220px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center">Iniciando cámara...</div>
  <pre id="log" style="white-space:pre-wrap;padding:8px;border:1px solid #ddd;margin-top:8px;"></pre>

<script>
const logEl = document.getElementById('log');
const readerEl = document.getElementById('reader');
function log(msg){ const t = new Date().toLocaleTimeString() + ' — ' + msg + '\\n'; logEl.textContent = t + logEl.textContent; console.log(msg); }

async function runDiagnostic(){
  log('Comprobando soporte navigator.mediaDevices...');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    readerEl.textContent = 'API getUserMedia no soportada';
    log('getUserMedia no soportada en este navegador');
    return;
  }

  // 1) Intento simple para forzar permiso y ver error
  try {
    log('Solicitando permiso de cámara (getUserMedia simple)...');
    const s = await navigator.mediaDevices.getUserMedia({ video: true });
    s.getTracks().forEach(t => t.stop());
    log('Permiso concedido y stream detenido correctamente');
  } catch (e) {
    log('Error en getUserMedia simple: ' + e.name + ' — ' + e.message);
    readerEl.textContent = 'Error getUserMedia: ' + e.name;
    // No return: seguimos para listar dispositivos
  }

  // 2) Enumerar dispositivos
  try {
    log('Enumerando dispositivos...');
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoInputs = devices.filter(d => d.kind === 'videoinput');
    log('Dispositivos totales: ' + devices.length + ', cámaras detectadas: ' + videoInputs.length);
    videoInputs.forEach((d,i) => log('Cam ' + i + ': label="' + (d.label||'') + '" deviceId="' + d.deviceId + '"'));
    if (!videoInputs.length) {
      readerEl.textContent = 'No se detectaron cámaras (videoinput)';
      return;
    }

    // 3) Intento con facingMode environment
    try {
      log('Intentando iniciar cámara con facingMode: environment...');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
      document.getElementById('reader').textContent = 'Cámara iniciada con facingMode (prueba)';
      stream.getTracks().forEach(t => t.stop());
      log('Éxito con facingMode environment');
      return;
    } catch (e) {
      log('facingMode falló: ' + e.name + ' — ' + e.message);
    }

    // 4) Fallback: intentar con deviceId probable trasero (label o última)
    let chosen = videoInputs.find(d => /back|rear|environment|trasera|posterior/i.test(d.label));
    if (!chosen) chosen = videoInputs[videoInputs.length - 1];
    log('Intentando iniciar con deviceId seleccionado: ' + (chosen.label || chosen.deviceId));
    try {
      const stream2 = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: chosen.deviceId } } });
      document.getElementById('reader').textContent = 'Cámara iniciada con deviceId (prueba)';
      stream2.getTracks().forEach(t => t.stop());
      log('Éxito con deviceId seleccionado');
      return;
    } catch (e) {
      log('Error con deviceId: ' + e.name + ' — ' + e.message);
      readerEl.textContent = 'No se pudo iniciar la cámara con deviceId';
    }
  } catch (err) {
    log('Error enumerando dispositivos: ' + (err.name || '') + ' — ' + (err.message || err));
    readerEl.textContent = 'Error enumerando dispositivos';
  }
}

window.addEventListener('load', runDiagnostic);
</script>
</body>
</html>
