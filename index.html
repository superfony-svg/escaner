<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Dogma Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background-color: #f4f4f9; text-align: center; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #reader { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            margin-bottom: 15px;
            position: relative;
        }

        /* CORRECCIÓN DE ORIENTACIÓN: 
           Esto hace que la cámara se vea en la posición correcta (horizontal)
           sin romper el detector de códigos. */
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transform: rotate(90deg); 
        }
        
        #resultado { margin-top: 15px; font-size: 18px; font-weight: bold; padding: 10px; background: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Inventario Dogma</h1>
    <div id="reader"></div>
    <div id="resultado">Esperando escaneo...</div>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    window.onload = function() {
        // Configuramos para usar la cámara trasera y forzamos la relación de aspecto
        html5QrCode.start(
            { facingMode: "environment" }, 
            { 
                fps: 10, 
                qrbox: { width: 300, height: 100 },
                aspectRatio: 1.777 
            },
            (decodedText) => {
                document.getElementById('resultado').innerText = "Código detectado: " + decodedText;
                
                // Feedback auditivo rápido
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = 880; 
                osc.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
                
                // Vibración
                if (navigator.vibrate) navigator.vibrate(200);
            }
        ).catch(err => {
            document.getElementById('resultado').innerText = "Error: " + err;
        });
    };
</script>
</body>
</html>
