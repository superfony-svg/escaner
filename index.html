<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventario Dogma - Arranque Trasera Automático</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>

  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f9;color:#222;padding:12px}
    .wrap{max-width:520px;margin:0 auto;background:#fff;padding:14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    #reader{width:100%;height:320px;background:#000;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
    pre#log{white-space:pre-wrap;background:#fafafa;border:1px solid #eee;padding:8px;border-radius:6px;max-height:160px;overflow:auto}
    label{display:block;margin-top:8px;font-weight:600}
    input[type="text"], input[type="number"]{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-top:6px;box-sizing:border-box}
    .row{display:flex;gap:8px;margin-top:10px}
    button{flex:1;padding:12px;border-radius:6px;border:0;font-weight:700;color:#fff;cursor:pointer}
    .btn-green{background:#28a745}.btn-yellow{background:#f0ad4e;color:#000}.btn-red{background:#dc3545}.btn-blue{background:#007bff}
    table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
    th,td{border:1px solid #eaeaea;padding:8px;text-align:left}
    th{background:#fafafa}
    @media(max-width:520px){#reader{height:240px}}
  </style>
</head>
<body>
  <div class="wrap" role="main" aria-labelledby="title">
    <h1 id="title">Inventario Dogma - Cámara Trasera Automática</h1>

    <div id="reader" aria-live="polite">Iniciando cámara...</div>
    <pre id="log"></pre>

    <label for="codigo">Código escaneado</label>
    <input id="codigo" type="text" readonly placeholder="Esperando escaneo...">

    <label for="cantidad">Cantidad</label>
    <input id="cantidad" type="number" min="1" placeholder="Cantidad">

    <div class="row">
      <button id="btnRegistrar" class="btn-green">📥 Registrar</button>
      <button id="btnToggle" class="btn-blue">⏸️ Pausar</button>
    </div>

    <div class="row">
      <button id="btnExport" class="btn-yellow">🍏 Exportar a EXCEL</button>
      <button id="btnClear" class="btn-red">🧹 Borrar todo</button>
    </div>

    <div style="display:flex;justify-content:space-between;margin-top:10px">
      <div><strong>Registros:</strong> <span id="totalReg">0</span></div>
      <div><strong>Total Cantidad:</strong> <span id="sumaTotal">0</span></div>
    </div>

    <table id="tablaInventario" aria-label="Tabla de inventario">
      <thead><tr><th>Código</th><th>Cantidad</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
/* Inventario + arranque automático de cámara trasera sin campo deviceId */
let inventario = JSON.parse(localStorage.getItem('datos_inv')) || [];
let html5QrCode = null;
let scannerActivo = false;
let lastDecoded = null;
let lastTime = 0;
const DEBOUNCE_MS = 1200;
const logEl = document.getElementById('log');
const readerEl = document.getElementById('reader');

function log(msg){
  const t = new Date().toLocaleTimeString();
  logEl.textContent = `${t} — ${msg}\n` + logEl.textContent;
  console.log(msg);
}

/* UI init */
window.addEventListener('load', () => {
  actualizarTabla();
  document.getElementById('btnRegistrar').addEventListener('click', registrar);
  document.getElementById('btnExport').addEventListener('click', exportar);
  document.getElementById('btnClear').addEventListener('click', borrarTodo);
  document.getElementById('btnToggle').addEventListener('click', toggleScanner);
  document.getElementById('cantidad').addEventListener('keydown', e => { if (e.key === 'Enter') registrar(); });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    readerEl.textContent = 'getUserMedia no soportado';
    log('API getUserMedia no soportada');
    return;
  }

  // Pedimos permiso para que enumerateDevices muestre labels
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => { s.getTracks().forEach(t => t.stop()); arrancarTraseraSecuencial(); })
    .catch(e => {
      readerEl.textContent = 'Permiso denegado o cámara no disponible';
      log('getUserMedia inicial falló: ' + e.name + ' — ' + e.message);
    });

  window.addEventListener('beforeunload', detenerScannerSilencioso);
});

/* Detener instancia previa */
async function detenerScannerSilencioso() {
  if (!html5QrCode) return;
  try { await html5QrCode.stop(); } catch(e){}
  try { html5QrCode.clear(); } catch(e){}
  html5QrCode = null;
  scannerActivo = false;
}

/* Intento definitivo: facingMode -> probar cada deviceId (priorizar labels "back") */
async function arrancarTraseraSecuencial() {
  await detenerScannerSilencioso();
  // 1) Intento rápido con facingMode
  try {
    html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess,
      onScanFailure
    );
    scannerActivo = true;
    readerEl.textContent = 'Escanea (trasera por facingMode)';
    document.getElementById('btnToggle').textContent = '⏸️ Pausar';
    log('Cámara iniciada con facingMode: environment');
    return;
  } catch (err) {
    log('facingMode falló: ' + (err.name||'') + ' — ' + (err.message||err));
    await detenerScannerSilencioso();
  }

  // 2) Enumerar cámaras y crear lista priorizada
  let videoInputs = [];
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    videoInputs = devices.filter(d => d.kind === 'videoinput');
    log('Cámaras detectadas: ' + videoInputs.length);
    videoInputs.forEach((d,i) => log(`Cam ${i}: label="${d.label||''}" id="${d.deviceId}"`));
    if (!videoInputs.length) throw new Error('No se detectaron cámaras');
  } catch (e) {
    readerEl.textContent = 'No se detectaron cámaras';
    log('enumerateDevices falló: ' + (e.name||'') + ' — ' + (e.message||e));
    return;
  }

  // Priorizar cámaras con label que indique trasera
  const prioritized = [
    ...videoInputs.filter(d => /back|rear|environment|trasera|posterior|facing back/i.test(d.label)),
    ...videoInputs.filter(d => !/back|rear|environment|trasera|posterior|facing back/i.test(d.label))
  ];

  // 3) Probar cada deviceId secuencialmente con timeout por intento
  for (const cam of prioritized) {
    log('Intentando deviceId: ' + (cam.label || cam.deviceId));
    const ok = await intentarIniciarDeviceIdConTimeout(cam.deviceId, 3500);
    if (ok) {
      log('Éxito con deviceId: ' + (cam.label || cam.deviceId));
      return;
    } else {
      log('Fallo con deviceId: ' + (cam.label || cam.deviceId));
      await detenerScannerSilencioso();
    }
  }

  // 4) Si todo falla, mostrar diagnóstico final
  readerEl.textContent = 'No se pudo iniciar la cámara trasera automáticamente';
  log('Todos los intentos fallaron. Revisa permisos o prueba otro navegador/móvil.');
}

/* Intentar iniciar con deviceId y timeout */
function intentarIniciarDeviceIdConTimeout(deviceId, timeoutMs) {
  return new Promise(async resolve => {
    let finished = false;
    const timer = setTimeout(async () => {
      if (finished) return;
      finished = true;
      log('Timeout al iniciar deviceId: ' + deviceId);
      try { if (html5QrCode) await html5QrCode.stop(); } catch(e){}
      resolve(false);
    }, timeoutMs);

    try {
      html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start(
        { deviceId: { exact: deviceId } },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanFailure
      );
      if (finished) {
        // si ya expiró el timeout, detener y devolver false
        try { await html5QrCode.stop(); } catch(e){}
        clearTimeout(timer);
        resolve(false);
        return;
      }
      finished = true;
      clearTimeout(timer);
      scannerActivo = true;
      readerEl.textContent = 'Escanea (trasera seleccionada)';
      document.getElementById('btnToggle').textContent = '⏸️ Pausar';
      resolve(true);
    } catch (err) {
      if (!finished) {
        finished = true;
        clearTimeout(timer);
        log('Error start deviceId: ' + (err.name||'') + ' — ' + (err.message||err));
        resolve(false);
      }
    }
  });
}

/* Callbacks de escaneo */
function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastDecoded && (now - lastTime) < DEBOUNCE_MS) return;
  lastDecoded = decodedText;
  lastTime = now;

  try { new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{}); } catch(e){}
  if (navigator.vibrate) navigator.vibrate(80);

  document.getElementById('codigo').value = decodedText;
  document.getElementById('cantidad').focus();
  document.getElementById('cantidad').select();
  log('Código detectado: ' + decodedText);
}
function onScanFailure(error) { /* no loguear cada frame */ }

/* Pausar / reanudar */
async function toggleScanner() {
  if (!html5QrCode) { arrancarTraseraSecuencial(); return; }
  if (scannerActivo) {
    try {
      if (html5QrCode.pause) await html5QrCode.pause(true);
      else await html5QrCode.stop();
      scannerActivo = false;
      document.getElementById('btnToggle').textContent = '▶️ Reanudar';
      readerEl.textContent = 'Escáner en pausa';
      log('Escáner pausado');
    } catch (e) {
      await detenerScannerSilencioso();
      document.getElementById('btnToggle').textContent = '▶️ Reanudar';
      log('Error al pausar: ' + (e.name || '') + ' — ' + (e.message || e));
    }
  } else {
    try {
      if (html5QrCode && html5QrCode.resume) await html5QrCode.resume();
      else await arrancarTraseraSecuencial();
      scannerActivo = true;
      document.getElementById('btnToggle').textContent = '⏸️ Pausar';
      readerEl.textContent = 'Escanea un código';
      log('Escáner reanudado');
    } catch (e) {
      log('Error al reanudar: ' + (e.name || '') + ' — ' + (e.message || e));
      arrancarTraseraSecuencial();
    }
  }
}

/* Registro y tabla */
function registrar() {
  const cod = document.getElementById('codigo').value.trim();
  const cantVal = document.getElementById('cantidad').value;
  const cant = parseInt(cantVal, 10);
  if (!cod) return alert('Escanea un código primero');
  if (!cantVal || isNaN(cant) || cant <= 0) return alert('Introduce una cantidad válida (mayor que 0)');

  const existente = inventario.find(i => i.Codigo === cod);
  if (existente) existente.Cantidad = Number(existente.Cantidad) + cant;
  else inventario.push({ Codigo: cod, Cantidad: cant });

  localStorage.setItem('datos_inv', JSON.stringify(inventario));
  try { new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{}); } catch(e){}
  if (navigator.vibrate) navigator.vibrate([40,20,40]);

  document.getElementById('codigo').value = '';
  document.getElementById('cantidad').value = '';
  document.getElementById('cantidad').focus();
  actualizarTabla();
  log('Registrado: ' + cod + ' x' + cant);
}

function actualizarTabla() {
  const tbody = document.querySelector('#tablaInventario tbody');
  tbody.innerHTML = '';
  [...inventario].slice().reverse().forEach(item => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.textContent = item.Codigo;
    const td2 = document.createElement('td'); td2.textContent = item.Cantidad;
    tr.appendChild(td1); tr.appendChild(td2); tbody.appendChild(tr);
  });
  document.getElementById('totalReg').innerText = inventario.length;
  const suma = inventario.reduce((s, it) => s + Number(it.Cantidad), 0);
  document.getElementById('sumaTotal').innerText = suma;
}

function exportar() {
  if (!inventario.length) return alert('No hay datos para exportar');
  const datos = inventario.map(i => ({ Codigo: i.Codigo, Cantidad: Number(i.Cantidad) }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(datos, { header: ['Codigo','Cantidad'] });
  XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  const fecha = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const filename = `Inventario_Dogma_${fecha}.xlsx`;
  XLSX.writeFile(wb, filename);
  log('Exportado a ' + filename);
}

function borrarTodo() {
  if (!confirm('¿Borrar todo el inventario? Esta acción no se puede deshacer.')) return;
  inventario = [];
  localStorage.removeItem('datos_inv');
  actualizarTabla();
  document.getElementById('codigo').value = '';
  document.getElementById('cantidad').value = '';
  log('Inventario borrado');
}
</script>
</body>
</html>
