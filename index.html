<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario Industrial</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        text-align: center;
    }

    #video {
        width: 100%;
        max-height: 40vh;
        background: #000;
    }

    #status {
        font-size: 1.4rem;
        padding: 10px;
        background: #222;
        margin-bottom: 10px;
    }

    button {
        width: 90%;
        padding: 15px;
        margin: 8px 0;
        font-size: 1.2rem;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
    }

    #fileInput {
        margin: 15px 0;
    }

    #tabla {
        width: 100%;
        margin-top: 20px;
        font-size: 1.1rem;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td {
        border: 1px solid #444;
        padding: 8px;
    }

    th {
        background: #333;
    }

    #cantidadInput {
        width: 80px;
        font-size: 1.2rem;
        padding: 5px;
    }

    #pantallaSesion {
        padding: 20px;
        background: #222;
    }

    #ubicacionInput {
        width: 90%;
        padding: 10px;
        font-size: 1.2rem;
        margin-top: 10px;
        border-radius: 6px;
        border: none;
    }

    /* Botón invisible para desbloquear audio */
    #unlockAudioBtn {
        opacity: 0;
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
    }
</style>
</head>

<body>

<!-- BOTÓN INVISIBLE PARA DESBLOQUEAR AUDIO -->
<button id="unlockAudioBtn">unlock</button>

<!-- ============================
     PANTALLA DE SESIÓN
============================= -->
<div id="pantallaSesion">
    <h2>📍 Configurar sesión</h2>
    <p>¿Quieres usar ubicación en esta sesión?</p>

    <button onclick="iniciarSesion(true)">Sí, usar ubicación</button>
    <button onclick="iniciarSesion(false)" style="background:#555;">No usar ubicación</button>

    <div id="campoUbicacion" style="display:none;">
        <h3>Introduce ubicación:</h3>
        <input type="text" id="ubicacionInput" placeholder="Ej: Pasillo 3B" />
        <button onclick="confirmarUbicacion()">Confirmar ubicación</button>
    </div>
</div>

<!-- ============================
     APP PRINCIPAL
============================= -->
<div id="app" style="display:none;">

<h2>📦 Inventario Industrial</h2>

<div id="status">Cargando cámara…</div>

<video id="video" autoplay playsinline></video>

<hr>

<h3>📁 Cargar maestro CSV</h3>
<input type="file" id="fileInput" accept=".csv" />

<h3>📥 Registro</h3>
Cantidad: <input type="number" id="cantidadInput" value="1" min="1" />

<div id="descripcionProducto" style="margin-top:10px; font-size:1.3rem; color:#0f0;"></div>

<button id="btnRegistrar">Registrar</button>

<hr>

<h3>📄 Inventario actual</h3>
<div id="tabla"></div>

<button id="btnExportar">Exportar CSV</button>
<button id="btnLimpiar" style="background:#b30000;">Limpiar inventario</button>

</div>

<script>
/* ------------------------------
   VARIABLES GLOBALES
--------------------------------*/
let video = document.getElementById("video");
let statusDiv = document.getElementById("status");
let descripcionDiv = document.getElementById("descripcionProducto");

let maestro = {}; 
let inventario = []; 

let ultimoCodigo = "";
let detector = null;
let puedeEscanear = true;

let sesionConUbicacion = false;
let ubicacionActual = "";

/* ------------------------------
   SONIDOS (Base64)
--------------------------------*/
const beepScan = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA...");
const beepOk   = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA...");

/* ------------------------------
   DESBLOQUEAR AUDIO
--------------------------------*/
document.getElementById("unlockAudioBtn").addEventListener("click", () => {
    beepScan.play().catch(()=>{});
    beepOk.play().catch(()=>{});
});

/* Se pulsa automáticamente al cargar */
window.addEventListener("load", () => {
    document.getElementById("unlockAudioBtn").click();
});

/* ------------------------------
   SESIÓN: SÍ / NO UBICACIÓN
--------------------------------*/
function iniciarSesion(conUbicacion) {
    sesionConUbicacion = conUbicacion;

    if (conUbicacion) {
        document.getElementById("campoUbicacion").style.display = "block";
    } else {
        document.getElementById("pantallaSesion").style.display = "none";
        document.getElementById("app").style.display = "block";
        iniciarCamara();
    }
}

function confirmarUbicacion() {
    const txt = document.getElementById("ubicacionInput").value.trim();
    if (txt === "") {
        alert("Introduce una ubicación válida.");
        return;
    }

    ubicacionActual = txt;

    document.getElementById("pantallaSesion").style.display = "none";
    document.getElementById("app").style.display = "block";

    iniciarCamara();
}

/* ------------------------------
   INICIAR CÁMARA TRASERA
--------------------------------*/
async function iniciarCamara() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } }
        });
        video.srcObject = stream;
        statusDiv.textContent = "Cámara activa";
    } catch (e) {
        statusDiv.textContent = "Error iniciando cámara";
        console.error(e);
    }
}

/* ------------------------------
   CARGAR MAESTRO CSV
--------------------------------*/
document.getElementById("fileInput").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (evt) {
        const lines = evt.target.result.split("\n");
        maestro = {};

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",");
            if (cols.length >= 2) {
                const codigo = cols[0].trim();
                const descripcion = cols[1].trim();
                maestro[codigo] = descripcion;
            }
        }

        alert("Maestro cargado correctamente. Productos: " + Object.keys(maestro).length);
    };

    reader.readAsText(file);
});

/* ------------------------------
   PREPARAR DETECTOR
--------------------------------*/
async function prepararDetector() {
    if ("BarcodeDetector" in window) {
        detector = new BarcodeDetector({
            formats: ["ean_13", "code_128", "qr_code"]
        });
    } else {
        alert("BarcodeDetector no soportado.");
    }
}

prepararDetector();

/* ------------------------------
   ESCANEO AUTOMÁTICO
--------------------------------*/
setInterval(async () => {
    if (!detector || !puedeEscanear) return;

    try {
        const barcodes = await detector.detect(video);
        if (barcodes.length > 0) {
            const codigo = barcodes[0].rawValue;

            if (codigo !== ultimoCodigo) {
                ultimoCodigo = codigo;
                procesarCodigo(codigo);
                beepScan.play();   // 🔊 sonido al escanear
            }
        }
    } catch (e) {
        console.error(e);
    }
}, 300);

/* ------------------------------
   PROCESAR CÓDIGO
--------------------------------*/
function procesarCodigo(codigo) {
    if (!maestro[codigo]) {
        descripcionDiv.style.color = "#f00";
        descripcionDiv.textContent = "❌ Código no encontrado en maestro";
        return;
    }

    descripcionDiv.style.color = "#0f0";
    descripcionDiv.textContent = "✔ " + maestro[codigo];
}

/* ------------------------------
   REGISTRAR INVENTARIO
--------------------------------*/
document.getElementById("btnRegistrar").addEventListener("click", () => {
    if (!ultimoCodigo || !maestro[ultimoCodigo]) {
        alert("No hay código válido escaneado.");
        return;
    }

    const cantidad = parseInt(document.getElementById("cantidadInput").value);

    // 🔥 Si ya existe, sumar cantidad
    const existente = inventario.find(item => item.codigo === ultimoCodigo);

    if (existente) {
        existente.cantidad += cantidad;
    } else {
        inventario.push({
            codigo: ultimoCodigo,
            descripcion: maestro[ultimoCodigo],
            cantidad,
            ubicacion: sesionConUbicacion ? ubicacionActual : ""
        });
    }

    beepOk.play();  // 🔊 sonido al registrar

    actualizarTabla();
    descripcionDiv.textContent = "";
    ultimoCodigo = "";
});

/* ------------------------------
   TABLA
--------------------------------*/
function actualizarTabla() {
    let html = `
        <table>
            <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th>Cantidad</th>
                ${sesionConUbicacion ? "<th>Ubicación</th>" : ""}
            </tr>
    `;

    inventario.forEach(item => {
        html += `
            <tr>
                <td>${item.codigo}</td>
                <td>${item.descripcion}</td>
                <td>${item.cantidad}</td>
                ${sesionConUbicacion ? `<td>${item.ubicacion}</td>` : ""}
            </tr>
        `;
    });

    html += "</table>";
    document.getElementById("tabla").innerHTML = html;
}

/* ------------------------------
   EXPORTAR CSV
--------------------------------*/
document.getElementById("btnExportar").addEventListener("click", () => {
    let csv = sesionConUbicacion
        ? "codigo,descripcion,cantidad,ubicacion\n"
        : "codigo,descripcion,cantidad\n";

    inventario.forEach(item => {
        csv += sesionConUbicacion
            ? `${item.codigo},${item.descripcion},${item.cantidad},${item.ubicacion}\n`
            : `${item.codigo},${item.descripcion},${item.cantidad}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "inventario.csv";
    a.click();
});

/* ------------------------------
   LIMPIAR
--------------------------------*/
document.getElementById("btnLimpiar").addEventListener("click", () => {
    if (confirm("¿Seguro que deseas borrar todo el inventario?")) {
        inventario = [];
        actualizarTabla();
    }
});
</script>

</body>
</html>
