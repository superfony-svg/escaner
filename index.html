<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inventario Dogma — Escáner + Maestro CSV</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f9;padding:12px;display:flex;justify-content:center}
  .card{width:100%;max-width:520px;background:#fff;padding:14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  #videoWrap{background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;height:320px}
  video{width:100%;height:100%;object-fit:cover}
  #indicator{margin-top:10px;font-weight:700;color:#2b7a2b;height:22px}
  label{display:block;margin-top:10px;font-weight:600}
  input,button{width:100%;padding:12px;margin-top:6px;border-radius:6px;border:1px solid #ddd;box-sizing:border-box}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1;border:0;color:#fff;font-weight:700;cursor:pointer}
  .green{background:#28a745}.blue{background:#007bff}.yellow{background:#f0ad4e;color:#000}.red{background:#dc3545}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th,td{border:1px solid #eaeaea;padding:8px;text-align:left}
  th{background:#fafafa}
  #csvStatus{margin-top:6px;color:#555;font-size:14px;min-height:18px}
  @media(max-width:520px){#videoWrap{height:220px}}
</style>
</head>
<body>
<div class="card">
  <h2>Inventario Dogma — Escáner</h2>

  <!-- CARGA DE MAESTRO CSV -->
  <label for="csvInput"><strong>📤 Cargar maestro de artículos (CSV)</strong></label>
  <input type="file" id="csvInput" accept=".csv">
  <div id="csvStatus"></div>

  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="indicator">Escaneando…</div>

  <!-- Campo oculto para almacenar internamente el código -->
  <input id="codigoHidden" type="hidden">

  <label for="cantidad">Cantidad</label>
  <input id="cantidad" type="number" min="1" placeholder="Cantidad">

  <div class="row">
    <button id="btnRegistrar" class="green">📥 Registrar</button>
    <button id="btnToggle" class="blue">⏸️ Pausar</button>
  </div>

  <div class="row">
    <button id="btnExport" class="yellow">🍏 Exportar CSV</button>
    <button id="btnClear" class="red">🧹 Borrar todo</button>
  </div>

  <div style="display:flex;justify-content:space-between;margin-top:10px">
    <div><strong>Registros:</strong> <span id="totalReg">0</span></div>
    <div><strong>Total Cantidad:</strong> <span id="sumaTotal">0</span></div>
  </div>

  <table id="tablaInventario">
    <thead><tr><th>Código</th><th>Descripción</th><th>Cantidad</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
/* ============================
   VARIABLES GENERALES
   ============================ */
let video = document.getElementById('video');
let indicator = document.getElementById('indicator');
let codigoHidden = document.getElementById('codigoHidden');
let cantidadEl = document.getElementById('cantidad');
let csvStatus = document.getElementById('csvStatus');

let inventario = JSON.parse(localStorage.getItem('datos_inv')) || [];
let maestro = {}; // maestro[codigo] = { descripcion }

let stream = null;
let scanning = false;
let lastDecoded = null;
let lastTime = 0;
const DEBOUNCE = 1000;

/* ============================
   UTILIDADES
   ============================ */
function vibrar(){ if(navigator.vibrate) navigator.vibrate(60); }
function beep(){ try{ new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play(); }catch(e){} }
function beepError(){ try{ new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play(); }catch(e){} }

function actualizarTabla(){
  const tbody = document.querySelector('#tablaInventario tbody');
  tbody.innerHTML = '';
  [...inventario].slice().reverse().forEach(i=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i.Codigo}</td><td>${i.Descripcion || ""}</td><td>${i.Cantidad}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('totalReg').textContent = inventario.length;
  document.getElementById('sumaTotal').textContent = inventario.reduce((a,b)=>a+Number(b.Cantidad),0);
}

/* ============================
   CARGA DE MAESTRO CSV
   Formato: codigo,descripcion
   ============================ */
document.getElementById('csvInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(evt){
    const text = evt.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if(!lines.length){
      csvStatus.textContent = "❌ El archivo está vacío";
      return;
    }

    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const idxCodigo = header.indexOf('codigo');
    const idxDesc   = header.indexOf('descripcion');

    if(idxCodigo === -1 || idxDesc === -1){
      csvStatus.textContent = "❌ El CSV debe tener columnas: codigo, descripcion";
      maestro = {};
      return;
    }

    maestro = {};
    for(let i=1; i<lines.length; i++){
      const row = lines[i].split(',');
      if(row.length < 2) continue;
      const codigo = row[idxCodigo].trim();
      const descripcion = row[idxDesc].trim();
      if(!codigo) continue;
      maestro[codigo] = { descripcion };
    }

    csvStatus.textContent = `✔️ Maestro cargado: ${Object.keys(maestro).length} artículos`;
  };

  reader.readAsText(file, 'UTF-8');
});

/* ============================
   CÁMARA Y ESCANEO
   ============================ */
async function stopStream(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
  scanning=false;
  indicator.textContent="Escáner detenido";
}

async function startStream(constraints){
  await stopStream();
  stream = await navigator.mediaDevices.getUserMedia({video:constraints,audio:false});
  video.srcObject = stream;
  await video.play();
  scanning=true;
  indicator.textContent="Escaneando…";
  processLoop();
}

async function startRearCamera(){
  try{
    const tmp = await navigator.mediaDevices.getUserMedia({video:true});
    tmp.getTracks().forEach(t=>t.stop());
  }catch(e){
    indicator.textContent="Permiso de cámara denegado";
    return;
  }

  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
  const rear = devices.filter(d=>/back|rear|environment|trasera|posterior/i.test(d.label));
  const ordered = [...rear, ...devices];

  for(const cam of ordered){
    try{
      await startStream({deviceId:{exact:cam.deviceId}});
      return;
    }catch(e){}
  }

  try{
    await startStream({facingMode:{ideal:"environment"}});
  }catch(e){
    indicator.textContent="No se pudo iniciar la cámara";
  }
}

async function processLoop(){
  if(!scanning || !stream) return;

  const w = video.videoWidth;
  const h = video.videoHeight;
  if(!w || !h){ requestAnimationFrame(processLoop); return; }

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video,0,0,w,h);

  if("BarcodeDetector" in window){
    try{
      const detector = new BarcodeDetector();
      const codes = await detector.detect(video);
      if(codes.length){
        handleDecoded(codes[0].rawValue);
      }
    }catch(e){}
  }else{
    const img = ctx.getImageData(0,0,w,h);
    const qr = jsQR(img.data,w,h);
    if(qr) handleDecoded(qr.data);
  }

  requestAnimationFrame(processLoop);
}

/* ============================
   MANEJO DEL CÓDIGO DETECTADO
   ============================ */
function handleDecoded(text){
  const now = Date.now();
  if(text === lastDecoded && now - lastTime < DEBOUNCE) return;

  // Validar contra maestro
  if(!maestro[text]){
    indicator.textContent = "❌ Artículo no encontrado";
    vibrar();
    beepError();
    lastDecoded = null;
    codigoHidden.value = "";
    return;
  }

  lastDecoded = text;
  lastTime = now;
  codigoHidden.value = "***"; // oculto
  indicator.textContent = "Código detectado";
  beep();
  vibrar();
}

/* ============================
   REGISTRO DE INVENTARIO
   ============================ */
document.getElementById('btnRegistrar').addEventListener('click',()=>{
  const cod = lastDecoded;
  const cant = parseInt(cantidadEl.value,10);

  if(!cod) return alert("Escanea un código válido primero");
  if(!cant || cant<=0) return alert("Cantidad inválida");

  const desc = maestro[cod] ? maestro[cod].descripcion : "";

  const ex = inventario.find(i=>i.Codigo===cod);
  if(ex){
    ex.Cantidad += cant;
  } else {
    inventario.push({
      Codigo: cod,
      Descripcion: desc,
      Cantidad: cant
    });
  }

  localStorage.setItem('datos_inv',JSON.stringify(inventario));

  lastDecoded=null;
  codigoHidden.value="";
  cantidadEl.value="";
  cantidadEl.focus();
  indicator.textContent="Escaneando…";

  actualizarTabla();
  beep();
  vibrar();
});

/* ============================
   BOTONES: PAUSAR, EXPORTAR, BORRAR
   ============================ */
document.getElementById('btnToggle').addEventListener('click',()=>{
  if(scanning){
    stopStream();
    document.getElementById('btnToggle').textContent="▶️ Reanudar";
  }else{
    document.getElementById('btnToggle').textContent="⏸️ Pausar";
    startRearCamera();
  }
});

document.getElementById('btnClear').addEventListener('click',()=>{
  if(!confirm("¿Borrar todo el inventario?")) return;
  inventario=[];
  localStorage.removeItem('datos_inv');
  actualizarTabla();
});

document.getElementById('btnExport').addEventListener('click',()=>{
  if(!inventario.length) return alert("No hay datos para exportar");
  const header=["Codigo","Descripcion","Cantidad"];
  const rows=inventario.map(i=>[i.Codigo, i.Descripcion || "", i.Cantidad]);
  const csv=[header,...rows].map(r=>r.join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="Inventario_Dogma.csv";
  a.click();
  URL.revokeObjectURL(url);
});

/* ============================
   INICIO
   ============================ */
actualizarTabla();
startRearCamera();
</script>
</body>
</html>
